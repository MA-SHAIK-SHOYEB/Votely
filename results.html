<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo results • Votely</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header class="topbar"><a class="brand" th:href="@{/}"><span class="brand-icon">✓</span> Votely<span class="brand-dot">.</span></a><a class="text-link" th:href="@{/dashboard}">← Dashboard</a></header><main class="dashboard wrap"><div class="eyebrow">ADMIN VIEW</div><h1>Demo election results</h1><p class="muted">Fictional candidates • Local demonstration data only.</p><section class="panel results-panel"><div class="results-total"><span>Total votes recorded</span><strong th:text="${totalVotes}">0</strong></div><div class="result-row" th:each="candidate : ${candidates}"><div class="result-label"><b th:text="${candidate.value}">Candidate</b><span th:text="${results[candidate.key]} + ' votes'">0 votes</span></div><div class="bar-track"><div class="bar-fill" th:style="'width:' + (${totalVotes == 0 ? 0 : results[candidate.key] * 100 / totalVotes}) + '%'"></div></div></div><p class="fine-print">This page shows aggregate counts only. Results are visible to demo administrators for educational testing.</p></section></main></body></html>
